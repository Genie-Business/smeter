name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: node --check api/index.js
      - run: npm test

  mobile:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the version the app is developed on: newer releases deprecate
          # package:flutter/material.dart, which fails `flutter analyze`.
          flutter-version: 3.47.2
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build APK
        run: >
          flutter build apk --release --target-platform android-arm64
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://api.smeter.app' }}
      - uses: actions/upload-artifact@v5
        with:
          name: smeter-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  # iOS can only be built on macOS. This checks the app compiles for iPhone
  # (no signing); App Store builds are archived and uploaded from Xcode or with
  # signing secrets added here later (see docs/store/README.md).
  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - run: flutter pub get
      - name: Build iOS (unsigned)
        run: >
          flutter build ios --release --no-codesign
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://api.smeter.app' }}
